<!DOCTYPE html>
<html lang="he" dir="rtl">

<style>

  body {
    background: #fff;
    direction: rtl;

  }
  .hint {
    background: #f5f5f5;
    border-bottom: 1px solid #ddd;
    padding: 8px 14px;
